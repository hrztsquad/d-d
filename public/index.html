<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>-d</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #09090b;
      --surface: #111114;
      --surface-hover: #18181c;
      --border: #27272a;
      --border-focus: #52525b;
      --text: #fafafa;
      --muted: #a1a1aa;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    /* Login screen */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 280px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
    }

    .brand {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .gate {
      margin-top: 20px;
      display: flex;
      gap: 8px;
    }

    .gate input {
      flex: 1;
      min-width: 0;
      height: 38px;
      padding: 0 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 0.15em;
      outline: none;
    }

    .gate input:focus { border-color: var(--border-focus); }
    .gate input.invalid { border-color: var(--danger); }

    .gate button {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Dashboard */
    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      gap: 12px;
    }

    .topbar-left {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .stats {
      font-size: 12px;
      color: var(--muted);
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      height: 34px;
      padding: 0 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background: var(--surface-hover); border-color: var(--border-focus); }
    .btn-danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.35); }
    .btn-danger:hover { background: var(--danger-bg); border-color: var(--danger); }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .item-info {
      min-width: 0;
      flex: 1;
    }

    .item-name {
      font-size: 13px;
      font-weight: 600;
      word-break: break-all;
      margin-bottom: 4px;
    }

    .item-meta {
      font-size: 11px;
      color: var(--muted);
    }

    .item-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      font-size: 13px;
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

    /* Player modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-box {
      width: 100%;
      max-width: 820px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .modal-title {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal video {
      width: 100%;
      max-height: 75vh;
      background: #000;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Login Gate -->
  <div id="login-view" class="login-wrap">
    <main class="card">
      <div class="brand">-d</div>
      <form id="gate-form" class="gate" autocomplete="off">
        <input
          id="password-input"
          type="password"
          inputmode="numeric"
          placeholder="•••••"
          aria-label="Password"
          autofocus
        />
        <button type="submit" aria-label="Masuk">→</button>
      </form>
    </main>
  </div>

  <!-- Protected File Manager -->
  <div id="app-view" class="app hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand">-d</span>
        <span id="stats" class="stats"></span>
      </div>
      <div class="topbar-actions">
        <button id="refresh-btn" class="btn">↻ Refresh</button>
        <a class="btn" href="https://t.me/forumsemprot_bot" target="_blank" rel="noopener">↗ Bot</a>
        <button id="logout-btn" class="btn">Keluar</button>
      </div>
    </header>

    <div id="file-list" class="list"></div>
  </div>

  <!-- Video Player Modal -->
  <div id="player-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span id="player-title" class="modal-title"></span>
        <button id="close-player" class="btn">✕</button>
      </div>
      <video id="player-video" controls playsinline></video>
    </div>
  </div>

  <script>
    const loginView = document.getElementById("login-view");
    const appView = document.getElementById("app-view");
    const gateForm = document.getElementById("gate-form");
    const passwordInput = document.getElementById("password-input");
    const fileList = document.getElementById("file-list");
    const statsEl = document.getElementById("stats");
    const refreshBtn = document.getElementById("refresh-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const playerModal = document.getElementById("player-modal");
    const playerVideo = document.getElementById("player-video");
    const playerTitle = document.getElementById("player-title");
    const closePlayer = document.getElementById("close-player");

    function formatBytes(bytes) {
      if (!bytes) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(2) + " " + sizes[i];
    }

    function formatDate(ms) {
      return new Date(ms).toLocaleString("id-ID");
    }

    async function checkAuth() {
      const res = await fetch("/api/auth");
      const data = await res.json();
      if (data.authenticated) {
        showApp();
      } else {
        showLogin();
      }
    }

    function showLogin() {
      appView.classList.add("hidden");
      loginView.classList.remove("hidden");
      passwordInput.focus();
    }

    async function showApp() {
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
      await loadFiles();
    }

    async function loadFiles() {
      fileList.innerHTML = '<div class="empty">Memuat...</div>';
      const res = await fetch("/api/files");
      if (res.status === 401) return showLogin();
      const data = await res.json();
      const files = data.files || [];
      statsEl.textContent = `${files.length} file · ${formatBytes(data.totalSize || 0)}`;

      if (files.length === 0) {
        fileList.innerHTML = '<div class="empty">Belum ada video tersimpan.</div>';
        return;
      }

      fileList.innerHTML = "";
      for (const f of files) {
        const row = document.createElement("div");
        row.className = "item";

        const info = document.createElement("div");
        info.className = "item-info";
        const nameEl = document.createElement("div");
        nameEl.className = "item-name";
        nameEl.textContent = f.name;
        const metaEl = document.createElement("div");
        metaEl.className = "item-meta";
        metaEl.textContent = `${formatBytes(f.size)} · ${formatDate(f.mtime)}`;
        info.appendChild(nameEl);
        info.appendChild(metaEl);

        const actions = document.createElement("div");
        actions.className = "item-actions";

        const playBtn = document.createElement("button");
        playBtn.className = "btn";
        playBtn.textContent = "▶ Putar";
        playBtn.onclick = () => openPlayer(f.name);

        const dlBtn = document.createElement("a");
        dlBtn.className = "btn";
        dlBtn.textContent = "⬇ Unduh";
        dlBtn.href = `/media/${encodeURIComponent(f.name)}?download=1`;

        const delBtn = document.createElement("button");
        delBtn.className = "btn btn-danger";
        delBtn.textContent = "🗑 Hapus";
        delBtn.onclick = () => deleteFile(f.name);

        actions.appendChild(playBtn);
        actions.appendChild(dlBtn);
        actions.appendChild(delBtn);

        row.appendChild(info);
        row.appendChild(actions);
        fileList.appendChild(row);
      }
    }

    function openPlayer(name) {
      playerTitle.textContent = name;
      playerVideo.src = `/media/${encodeURIComponent(name)}`;
      playerModal.classList.remove("hidden");
      playerVideo.play().catch(() => {});
    }

    function hidePlayer() {
      playerVideo.pause();
      playerVideo.removeAttribute("src");
      playerVideo.load();
      playerModal.classList.add("hidden");
    }

    async function deleteFile(name) {
      if (!confirm(`Hapus file "${name}"?`)) return;
      const res = await fetch(`/api/files/${encodeURIComponent(name)}`, { method: "DELETE" });
      if (res.status === 401) return showLogin();
      await loadFiles();
    }

    gateForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: passwordInput.value.trim() })
      });
      if (res.ok) {
        passwordInput.value = "";
        await showApp();
      } else {
        passwordInput.classList.add("invalid");
        passwordInput.value = "";
        passwordInput.focus();
      }
    });

    passwordInput.addEventListener("input", () => passwordInput.classList.remove("invalid"));
    refreshBtn.addEventListener("click", loadFiles);
    logoutBtn.addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      showLogin();
    });
    closePlayer.addEventListener("click", hidePlayer);
    playerModal.addEventListener("click", (e) => {
      if (e.target === playerModal) hidePlayer();
    });

    checkAuth();
  </script>
</body>
</html>
