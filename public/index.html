<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>-d</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #09090b;
      --surface: #111114;
      --surface-hover: #18181c;
      --border: #27272a;
      --border-focus: #52525b;
      --text: #fafafa;
      --muted: #a1a1aa;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      -webkit-font-smoothing: antialiased;
    }

    .hidden { display: none !important; }

    /* Login screen */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 280px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      text-align: center;
    }

    .brand {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .gate {
      margin-top: 20px;
      display: flex;
      gap: 8px;
    }

    .gate input {
      flex: 1;
      min-width: 0;
      height: 38px;
      padding: 0 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 0.15em;
      outline: none;
    }

    .gate input:focus { border-color: var(--border-focus); }
    .gate input.invalid { border-color: var(--danger); }

    .gate button {
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Dashboard */
    .app {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      gap: 12px;
    }

    .topbar-left {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .stats {
      font-size: 12px;
      color: var(--muted);
    }

    .topbar-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      height: 34px;
      padding: 0 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover { background: var(--surface-hover); border-color: var(--border-focus); }
    .btn.active { background: var(--surface-hover); border-color: var(--text); }
    .btn-danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.35); }
    .btn-danger:hover { background: var(--danger-bg); border-color: var(--danger); }

    .view-toggle {
      display: inline-flex;
      gap: 4px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .list.grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .list.grid-view .item {
      padding: 0;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      overflow: hidden;
      gap: 0;
    }

    .thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-play {
      position: absolute;
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      pointer-events: none;
    }

    .list.grid-view .item-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      justify-content: space-between;
    }

    .item-info {
      min-width: 0;
      flex: 1;
    }

    .item-name {
      font-size: 13px;
      font-weight: 600;
      word-break: break-all;
      margin-bottom: 4px;
    }

    .list.grid-view .item-name {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .item-meta {
      font-size: 11px;
      color: var(--muted);
    }

    .item-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .empty {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      font-size: 13px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      grid-column: 1 / -1;
    }

    /* Player modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }

    .modal-box {
      width: 100%;
      max-width: 820px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }

    .modal-title {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .modal video {
      width: 100%;
      max-height: 75vh;
      background: #000;
      display: block;
    }

    /* Web Downloader Box */
    .dl-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .dl-box textarea {
      width: 100%;
      min-height: 74px;
      resize: vertical;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      padding: 10px 12px;
      outline: none;
    }

    .dl-box textarea:focus { border-color: var(--border-focus); }
    .dl-box textarea::placeholder { color: var(--muted); }

    .dl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .dl-msg {
      font-size: 12px;
      color: var(--muted);
    }

    .jobs {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .job {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
    }

    .job-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .job-status {
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .job-status.done { color: #4ade80; }
    .job-status.error { color: var(--danger); }
    .job-status.skipped { color: #fbbf24; }
  </style>
</head>
<body>
  <!-- Login Gate -->
  <div id="login-view" class="login-wrap">
    <main class="card">
      <div class="brand">-d</div>
      <form id="gate-form" class="gate" autocomplete="off">
        <input
          id="password-input"
          type="password"
          placeholder="Password"
          aria-label="Password"
          autofocus
        />
        <button type="submit" aria-label="Masuk">→</button>
      </form>
    </main>
  </div>

  <!-- Protected File Manager -->
  <div id="app-view" class="app hidden">
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand">-d</span>
        <span id="stats" class="stats"></span>
      </div>
      <div class="topbar-actions">
        <div class="view-toggle">
          <button id="view-grid-btn" class="btn">▦ Thumbnail</button>
          <button id="view-list-btn" class="btn">☰ List</button>
        </div>
        <button id="refresh-btn" class="btn">↻ Refresh</button>
        <a class="btn" href="https://t.me/forumsemprot_bot" target="_blank" rel="noopener">↗ Bot</a>
        <button id="logout-btn" class="btn">Keluar</button>
      </div>
    </header>

    <form id="dl-form" class="dl-box">
      <textarea id="dl-input" placeholder="Tempel 1 atau banyak link video (1 link per baris: Vidara, StreamTape, Doodstream, dll.)"></textarea>
      <div class="dl-row">
        <span id="dl-msg" class="dl-msg"></span>
        <div style="display:flex;gap:8px;">
          <button id="clear-jobs-btn" type="button" class="btn hidden">Bersihkan Riwayat</button>
          <button id="dl-btn" type="submit" class="btn">⬇ Download</button>
        </div>
      </div>
    </form>

    <div id="jobs-list" class="jobs hidden"></div>

    <div id="file-list" class="list"></div>
  </div>

  <!-- Video Player Modal -->
  <div id="player-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <span id="player-title" class="modal-title"></span>
        <button id="close-player" class="btn">✕</button>
      </div>
      <video id="player-video" controls playsinline></video>
    </div>
  </div>

  <script>
    const loginView = document.getElementById("login-view");
    const appView = document.getElementById("app-view");
    const gateForm = document.getElementById("gate-form");
    const passwordInput = document.getElementById("password-input");
    const dlForm = document.getElementById("dl-form");
    const dlInput = document.getElementById("dl-input");
    const dlBtn = document.getElementById("dl-btn");
    const dlMsg = document.getElementById("dl-msg");
    const clearJobsBtn = document.getElementById("clear-jobs-btn");
    const jobsList = document.getElementById("jobs-list");
    const fileList = document.getElementById("file-list");
    const statsEl = document.getElementById("stats");
    const viewGridBtn = document.getElementById("view-grid-btn");
    const viewListBtn = document.getElementById("view-list-btn");
    const refreshBtn = document.getElementById("refresh-btn");
    const logoutBtn = document.getElementById("logout-btn");
    const playerModal = document.getElementById("player-modal");
    const playerVideo = document.getElementById("player-video");
    const playerTitle = document.getElementById("player-title");
    const closePlayer = document.getElementById("close-player");

    let cachedFiles = [];
    let viewMode = localStorage.getItem("dd_view_mode") || "grid";

    function setViewMode(mode) {
      viewMode = mode === "list" ? "list" : "grid";
      localStorage.setItem("dd_view_mode", viewMode);
      viewGridBtn.classList.toggle("active", viewMode === "grid");
      viewListBtn.classList.toggle("active", viewMode === "list");
      fileList.classList.toggle("grid-view", viewMode === "grid");
      renderFiles();
    }

    viewGridBtn.addEventListener("click", () => setViewMode("grid"));
    viewListBtn.addEventListener("click", () => setViewMode("list"));

    function formatBytes(bytes) {
      if (!bytes) return "0 B";
      const k = 1024;
      const sizes = ["B", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(2) + " " + sizes[i];
    }

    function formatDate(ms) {
      return new Date(ms).toLocaleString("id-ID");
    }

    async function checkAuth() {
      const res = await fetch("api/auth");
      const data = await res.json();
      if (data.authenticated) {
        showApp();
      } else {
        showLogin();
      }
    }

    function showLogin() {
      appView.classList.add("hidden");
      loginView.classList.remove("hidden");
      passwordInput.focus();
    }

    async function showApp() {
      loginView.classList.add("hidden");
      appView.classList.remove("hidden");
      viewGridBtn.classList.toggle("active", viewMode === "grid");
      viewListBtn.classList.toggle("active", viewMode === "list");
      fileList.classList.toggle("grid-view", viewMode === "grid");
      await loadFiles();
    }

    async function loadFiles() {
      fileList.innerHTML = '<div class="empty">Memuat...</div>';
      const res = await fetch("api/files");
      if (res.status === 401) return showLogin();
      const data = await res.json();
      cachedFiles = data.files || [];
      statsEl.textContent = `${cachedFiles.length} file · ${formatBytes(data.totalSize || 0)}`;
      renderFiles();
    }

    function renderFiles() {
      if (cachedFiles.length === 0) {
        fileList.innerHTML = '<div class="empty">Belum ada video tersimpan.</div>';
        return;
      }

      fileList.innerHTML = "";
      for (const f of cachedFiles) {
        const row = document.createElement("div");
        row.className = "item";

        if (viewMode === "grid") {
          const thumb = document.createElement("div");
          thumb.className = "thumb";
          thumb.onclick = () => openPlayer(f.name);

          const img = document.createElement("img");
          img.loading = "lazy";
          img.alt = f.name;
          img.src = `thumb/${encodeURIComponent(f.name)}`;
          img.onerror = () => { img.style.display = "none"; };

          const playIcon = document.createElement("div");
          playIcon.className = "thumb-play";
          playIcon.textContent = "▶";

          thumb.appendChild(img);
          thumb.appendChild(playIcon);
          row.appendChild(thumb);
        }

        const info = document.createElement("div");
        info.className = "item-info";
        const nameEl = document.createElement("div");
        nameEl.className = "item-name";
        nameEl.textContent = f.name;
        const metaEl = document.createElement("div");
        metaEl.className = "item-meta";
        metaEl.textContent = `${formatBytes(f.size)} · ${formatDate(f.mtime)}`;
        info.appendChild(nameEl);
        info.appendChild(metaEl);

        const actions = document.createElement("div");
        actions.className = "item-actions";

        const playBtn = document.createElement("button");
        playBtn.className = "btn";
        playBtn.textContent = "▶ Putar";
        playBtn.onclick = () => openPlayer(f.name);

        const dlBtn = document.createElement("a");
        dlBtn.className = "btn";
        dlBtn.textContent = "⬇ Unduh";
        dlBtn.href = `media/${encodeURIComponent(f.name)}?download=1`;

        const delBtn = document.createElement("button");
        delBtn.className = "btn btn-danger";
        delBtn.textContent = "🗑 Hapus";
        delBtn.onclick = () => deleteFile(f.name);

        actions.appendChild(playBtn);
        actions.appendChild(dlBtn);
        actions.appendChild(delBtn);

        if (viewMode === "grid") {
          const body = document.createElement("div");
          body.className = "item-body";
          body.appendChild(info);
          body.appendChild(actions);
          row.appendChild(body);
        } else {
          row.appendChild(info);
          row.appendChild(actions);
        }

        fileList.appendChild(row);
      }
    }

    function openPlayer(name) {
      playerTitle.textContent = name;
      playerVideo.src = `media/${encodeURIComponent(name)}`;
      playerModal.classList.remove("hidden");
      playerVideo.play().catch(() => {});
    }

    function hidePlayer() {
      playerVideo.pause();
      playerVideo.removeAttribute("src");
      playerVideo.load();
      playerModal.classList.add("hidden");
    }

    async function deleteFile(name) {
      if (!confirm(`Hapus file "${name}"?`)) return;
      const res = await fetch(`api/files/${encodeURIComponent(name)}`, { method: "DELETE" });
      if (res.status === 401) return showLogin();
      await loadFiles();
    }

    gateForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: passwordInput.value.trim() })
      });
      if (res.ok) {
        passwordInput.value = "";
        await showApp();
      } else {
        passwordInput.classList.add("invalid");
        passwordInput.value = "";
        passwordInput.focus();
      }
    });

    passwordInput.addEventListener("input", () => passwordInput.classList.remove("invalid"));
    let jobTimer = null;
    let lastDoneCount = 0;

    async function loadJobs() {
      const res = await fetch("api/jobs");
      if (res.status === 401) return;
      const data = await res.json();
      const jobs = data.jobs || [];

      if (jobs.length === 0) {
        jobsList.classList.add("hidden");
        clearJobsBtn.classList.add("hidden");
        jobsList.innerHTML = "";
        if (jobTimer) {
          clearInterval(jobTimer);
          jobTimer = null;
        }
        return;
      }

      jobsList.classList.remove("hidden");
      const hasFinished = jobs.some(j => ["done", "skipped", "error"].includes(j.status));
      clearJobsBtn.classList.toggle("hidden", !hasFinished);

      jobsList.innerHTML = "";
      for (const j of jobs) {
        const row = document.createElement("div");
        row.className = "job";

        const titleEl = document.createElement("span");
        titleEl.className = "job-title";
        titleEl.textContent = j.filename || j.title || j.url;

        const statusEl = document.createElement("span");
        statusEl.className = `job-status ${j.status}`;
        statusEl.textContent = j.message || j.status;

        row.appendChild(titleEl);
        row.appendChild(statusEl);
        jobsList.appendChild(row);
      }

      const doneCount = jobs.filter(j => j.status === "done").length;
      if (doneCount > lastDoneCount) {
        lastDoneCount = doneCount;
        await loadFiles();
      }

      const hasActive = jobs.some(j => ["queued", "extracting", "downloading"].includes(j.status));
      if (hasActive && !jobTimer) {
        jobTimer = setInterval(loadJobs, 2000);
      } else if (!hasActive && jobTimer) {
        clearInterval(jobTimer);
        jobTimer = null;
      }
    }

    dlForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const urls = dlInput.value.trim();
      if (!urls) return;

      dlBtn.disabled = true;
      dlMsg.textContent = "Menambahkan ke antrean...";
      try {
        const res = await fetch("api/download", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ urls })
        });
        const data = await res.json();
        if (res.status === 401) return showLogin();
        if (!res.ok) {
          dlMsg.textContent = data.error || "Link tidak valid";
        } else {
          dlInput.value = "";
          dlMsg.textContent = `${data.added} link ditambahkan ke antrean.`;
          await loadJobs();
        }
      } catch (err) {
        dlMsg.textContent = "Gagal menghubungi server";
      } finally {
        dlBtn.disabled = false;
      }
    });

    clearJobsBtn.addEventListener("click", async () => {
      await fetch("api/jobs", { method: "DELETE" });
      await loadJobs();
    });

    refreshBtn.addEventListener("click", () => {
      loadFiles();
      loadJobs();
    });
    logoutBtn.addEventListener("click", async () => {
      if (jobTimer) {
        clearInterval(jobTimer);
        jobTimer = null;
      }
      await fetch("api/logout", { method: "POST" });
      showLogin();
    });
    closePlayer.addEventListener("click", hidePlayer);
    playerModal.addEventListener("click", (e) => {
      if (e.target === playerModal) hidePlayer();
    });

    checkAuth();
    loadJobs();
  </script>
</body>
</html>
